<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Formes - Exercice 2</title>
    <!-- Inclusion de la bibliothèque D3.js v3 -->
    <script src="https://d3js.org/d3.v3.min.js"></script>
    <style>
        #chart {
            margin: 20px auto;
            width: 300px;
            height: 300px;
        }
        svg {
            border: 1px solid #ccc;
        }
        circle, rect, line {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="chart"></div>

    <script>
        // 1. Définition des dimensions du canevas
        var width = 300;
        var height = 300;

        // 2. Définition de l'échelle linéaire de couleur
        var color = d3.scale.linear()
            .domain([0, 280])
            .range(["steelblue", "brown"])
            .interpolate(d3.interpolateHcl);

        // 3. Création du conteneur SVG et application de la couleur de fond
        var svg = d3.select("#chart")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("background-color", color(100)); // Exemple de valeur dans le domaine [0, 280]

        // 4. Création des formes géométriques

        // Cercle
        var cercle = svg.append("circle")
            .attr("cx", 60)
            .attr("cy", 60)
            .attr("r", 28)
            .style("fill", "gold")
            .style("stroke", "black")
            .style("stroke-width", 2);

        // Ligne
        var line = svg.append("line")
            .attr("x1", 28)
            .attr("y1", 20)
            .attr("x2", width / 2)
            .attr("y2", height / 2)
            .style("stroke", "darkgreen")
            .style("stroke-width", 4);

        // Rectangle
        var rect = svg.append("rect")
            .attr("x", 200)
            .attr("y", 200)
            .attr("width", 50)
            .attr("height", 50)
            .style("fill", "#761544");

        // 5. Fonctions d'interaction au survol (Mouseover / Mouseout)

        // Action quand la souris entre sur un élément
        function actionMO() {
            d3.select(this)
                .transition()
                .duration(200)
                .style("opacity", 0.6)
                .attr("transform", "scale(1.15)");
        }

        // Action quand la souris quitte un élément
        function actionMU() {
            d3.select(this)
                .transition()
                .duration(200)
                .style("opacity", 1.0)
                .attr("transform", "scale(1)");
        }

        // 6. Association des événements aux formes
        svg.selectAll("circle, rect, line")
            .on("mouseover", actionMO)
            .on("mouseout", actionMU);
    </script>

</body>
</html>
